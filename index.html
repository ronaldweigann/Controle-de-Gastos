<!DOCTYPE html> <!--VERSÃO DO HTML (MAIS MODERNA)-->

<html lang="pt-br"> <!-- FICA TODO O SITE -->

<head> <!-- CABEÇA - CONFIGURAÇÕES -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://js.puter.com/v2/"></script>
    <title>Controle de Gasto</title>
</head>
 
<body> <!-- TODA A PARTE VISÍVEL -->

    <div class="titulo">

        <h1>Controle de Gasto</h1>
        <p class="topo">Insira a imagem do comprovante. A IA anota pra você.</p>

    </div>

    <div class="caixa-total">

        <p>Total gasto</p>
        <h2 class="total-gasto">R$ 0,00</h2>
        
    </div>

    <!-- INPUT PARA SELECIONAR IMAGENS -->

    <!-- label -  -->
    <!-- change - mudar -->
    <label class="anexo">
        🧾 Anexar comprovante
        <input class="foto" onchange="lerFoto()" type="file" accept="image/*">
    </label>

    <div class="lista">
    <label class="telefone" for="telefone">Seu Contato:</label>

    <input 
        type="tel" 
        id="telefone" 
        class="input-telefone"
        placeholder="(67) 99999-9999"
    >

    <button class="envioTelefone" onclick="enviarWhatsApp()">
        Enviar para o WhatsApp
    </button>
</div>

</body>

<script src="scripts.js"></script>

</html>
